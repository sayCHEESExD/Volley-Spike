<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1f4fa8" />
  <title>Volley Spike</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet" />
  <!-- Bloxity / Legion platform SDK (window.Legion.SDK). Loaded, not bundled. The game also runs without it. -->
  <script src="https://sdk.bloxity.io/v1/legion-sdk.min.js"></script>
</head>
<body>
  <canvas id="game" tabindex="0"></canvas>
  <div id="ui"></div>
  <div id="loading">
    <div>
      <div class="logo">
        <svg viewBox="0 0 300 230" aria-label="Volley Spike">
          <defs>
            <radialGradient id="lb" cx="38%" cy="35%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset=".7" stop-color="#e9eef5"/><stop offset="1" stop-color="#aab6c6"/></radialGradient>
            <linearGradient id="lt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe14a"/><stop offset="1" stop-color="#ff8a1f"/></linearGradient>
            <linearGradient id="lt2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff6a4a"/><stop offset="1" stop-color="#d81e3a"/></linearGradient>
          </defs>
          <path d="M176 38 C 190 14, 214 18, 222 4" fill="none" stroke="#3a2a1a" stroke-width="7" stroke-linecap="round"/>
          <g transform="translate(224 4)"><circle r="11" fill="#ffd23a"/><circle r="6" fill="#fff"/><path d="M0-20V-12M0 12V20M-20 0H-12M12 0H20M-14-14L-9-9M9 9L14 14M-14 14L-9 9M9-9L14-14" stroke="#ffd23a" stroke-width="3" stroke-linecap="round"/></g>
          <circle cx="150" cy="82" r="58" fill="url(#lb)" stroke="#1c2b4a" stroke-width="6"/>
          <path d="M97 62 C 130 70, 170 60, 204 74" fill="none" stroke="#2a62d8" stroke-width="10"/>
          <path d="M100 104 C 135 96, 172 108, 202 96" fill="none" stroke="#ffd23a" stroke-width="10"/>
          <path d="M150 25 C 132 60, 136 104, 158 139" fill="none" stroke="#2a62d8" stroke-width="8"/>
          <rect x="164" y="22" width="22" height="14" rx="3" fill="#3a2a1a" transform="rotate(30 175 29)"/>
          <text x="150" y="182" text-anchor="middle" font-family="Fredoka, sans-serif" font-weight="700" font-size="52" fill="url(#lt)" stroke="#1c2b4a" stroke-width="9" paint-order="stroke" letter-spacing="1">VOLLEY</text>
          <text x="150" y="226" text-anchor="middle" font-family="Fredoka, sans-serif" font-weight="700" font-size="50" fill="url(#lt2)" stroke="#1c2b4a" stroke-width="9" paint-order="stroke" letter-spacing="4">SPIKE</text>
        </svg>
      </div>
      <div class="status-l">Loading...</div>
      <div class="bar"><i></i></div>
      <div style="text-align:center"><button class="play big">PLAY</button></div>
    </div>
  </div>
  <div id="rotate"><div>Turn your phone sideways to play</div></div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
